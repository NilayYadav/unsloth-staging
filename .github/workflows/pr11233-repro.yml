name: PR 11233 chat document cleanup repro

on:
  push:
    branches:
      - pr-11233-mimir-skill-e2e-pr-11233-20260917210541-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr11233-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    # negative = the two production files reverted to upstream main (no fix).
    # positive = the pull request's code. Everything else is identical.
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [negative, positive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Revert the fix (negative arm only)
        if: matrix.variant == 'negative'
        run: |
          set -euxo pipefail
          BASE=1d5210d7a9ec3c42c5f39c12ec25748d8c5287b3
          git checkout "$BASE" -- \
            studio/backend/core/rag/conversation_archive.py \
            studio/backend/routes/chat_history.py
          echo "--- proof the fix is absent ---"
          ! grep -q "_remove_thread_documents" studio/backend/routes/chat_history.py
          ! grep -q "delete_thread_documents" studio/backend/core/rag/conversation_archive.py
          echo "negative arm: production code is upstream main, test file is the PR's"

      - name: Install backend test dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx \
            soundfile librosa
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"
          pip install torchao

      - name: Negative - the three route-level tests must FAIL on main's code
        if: matrix.variant == 'negative'
        working-directory: studio/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/studio/backend
        run: |
          set -o pipefail
          # Only the three tests that go purely through the HTTP routes. The other two call
          # the helper this PR introduces, so they cannot exist on main by definition.
          set +e
          python -m pytest -p no:randomly -q --tb=short --timeout=330 \
            tests/test_rag_thread_document_cleanup.py::test_deleting_a_thread_removes_its_uploaded_documents \
            tests/test_rag_thread_document_cleanup.py::test_clearing_history_removes_every_threads_uploaded_documents \
            tests/test_rag_thread_document_cleanup.py::test_deleting_a_project_removes_its_member_threads_documents \
            2>&1 | tee /tmp/negative.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "pytest exit: $STATUS"
          if [ "$STATUS" -eq 0 ]; then
            echo "REPRO FAILED: the documents were already cleaned up without the fix"
            exit 1
          fi
          grep -Eq "3 failed" /tmp/negative.log || { echo "REPRO FAILED: expected exactly 3 failures"; exit 1; }
          # The failure must be documents surviving the delete, not a crash or an import error.
          grep -q "_document_ids(client)" /tmp/negative.log || { echo "REPRO FAILED: wrong failure site"; exit 1; }
          if grep -Eq "ImportError|ModuleNotFoundError|AttributeError|errors? during collection" /tmp/negative.log; then
            echo "REPRO FAILED: failed for the wrong reason"
            exit 1
          fi
          echo "NEGATIVE OK: without the fix, the uploaded documents survive the delete"

      - name: Positive - the whole cleanup suite must PASS on the PR's code
        if: matrix.variant == 'positive'
        working-directory: studio/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/studio/backend
        run: |
          set -o pipefail
          python -m pytest -p no:randomly -q --tb=short --timeout=330 \
            tests/test_rag_thread_document_cleanup.py 2>&1 | tee /tmp/positive.log
          grep -Eq "5 passed" /tmp/positive.log || { echo "expected all 5 to pass"; exit 1; }
          echo "POSITIVE OK: the fix removes the documents, the rows and the files"

      - name: Positive - the refactored archive suite must not regress
        if: matrix.variant == 'positive'
        working-directory: studio/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/studio/backend
        run: |
          python -m pytest -p no:randomly -q --tb=short --timeout=330 \
            tests/test_conversation_archive.py

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr11233-${{ matrix.variant }}-logs
          path: /tmp/*.log
          if-no-files-found: ignore
