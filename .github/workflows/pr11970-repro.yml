name: "PR 11970 HF_HOME scan folder repro"

on:
  push:
    branches: ['pr-11970-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: studio/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 requests 'numpy<3' pytest pytest-asyncio pytest-timeout httpx
      - name: Branch under test
        run: git log --oneline -3; git diff --stat origin/main...HEAD 2>/dev/null || true
      - name: PR regression tests (registered HF_HOME)
        run: |
          python -m pytest -q --tb=short --timeout=300 -rA \
            "hub/tests/test_model_services.py::test_local_inventory_lists_a_registered_hf_home" \
            "tests/test_local_model_format.py::test_compat_inventory_lists_a_registered_hf_home" \
            "tests/test_openai_auto_switch.py::test_build_index_covers_legacy_default_lmstudio_and_custom_roots"
      - name: Full changed test files
        if: always()
        run: |
          python -m pytest -q --tb=short --timeout=300 \
            hub/tests/test_model_services.py tests/test_local_model_format.py tests/test_openai_auto_switch.py \
            tests/test_scan_folder_health.py tests/test_cached_gguf_routes.py
