name: "staging-9301 macos-15"
on:
  push:
    branches: ["pr-9301-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/mcp_client.py'
      - 'studio/backend/core/inference/tool_loop_controller.py'
      - 'studio/backend/core/inference/tools.py'
      - 'studio/backend/models/mcp_servers.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/mcp_servers.py'
      - 'studio/backend/tests/test_mcp_apps.py'
      - 'studio/frontend/src/components/assistant-ui/tool-fallback.tsx'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/api/mcp-servers-api.ts'
      - 'studio/frontend/src/features/chat/hooks/use-chat-search-index.ts'
      - 'studio/frontend/src/features/chat/mcp-apps/mcp-app-frame.tsx'
      - 'studio/frontend/src/features/chat/utils/mcp-tool-name.ts'
      - 'studio/frontend/tests/mcp-app-envelope.test.ts'
      - '.github/workflows/staging-9301-macos-15.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_mcp_apps.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
