# Disposable repro workflow. Delete after validation.

name: "PR 11292 role mapping A-B proof"

on:
  push:
    branches:
      - "pr-11292-proof-20260918"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install pytest==9.0.2 structlog huggingface-hub

      - name: "Before: run identical regression suite against pre-fix implementation"
        shell: bash
        run: |
          git checkout ef00d4946731d2cb9bed2982f1a24346843e7e19 -- studio/backend/hub/utils/dataset_format.py studio/backend/utils/datasets/format_detection.py
          set +e
          python -m pytest studio/backend/tests/test_dataset_heuristic_role_keywords.py -q --tb=short > before.txt 2>&1
          result=$?
          set -e
          cat before.txt
          test "$result" = 1
          grep -F "8 failed, 18 passed" before.txt
          printf 'PASS: pre-fix code failed exactly eight role-mapping assertions
          '

      - name: "After: same suite with PR implementation"
        shell: bash
        run: |
          git checkout HEAD -- studio/backend/hub/utils/dataset_format.py studio/backend/utils/datasets/format_detection.py
          python -m pytest studio/backend/tests/test_dataset_heuristic_role_keywords.py -q --tb=short

