name: "PR 11229 LoRA push privacy A/B"

on:
  push:
    branches:
      - 'pr-11229-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr11229-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lora-push-privacy:
    name: LoRA push privacy assertions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Show which implementation is under test
        run: |
          echo "ref=${{ github.ref_name }} sha=${{ github.sha }}"
          echo "--- create_repo / privacy call sites in export_lora_adapter ---"
          sed -n '1620,1670p' studio/backend/core/export/export.py

      - name: Install backend test dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx \
            soundfile librosa
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"

      - name: Collection sanity (setup failures must not masquerade as the assertion)
        run: |
          set -euxo pipefail
          cd studio/backend
          python -m pytest --collect-only -q tests/test_export_hub_push.py

      - name: LoRA Hub push privacy tests
        run: |
          cd studio/backend
          python -m pytest -v --tb=short --timeout=330 \
            tests/test_export_hub_push.py -k lora
