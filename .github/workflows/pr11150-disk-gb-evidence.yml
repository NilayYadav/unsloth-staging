name: "PR 11150 disk GB UI evidence"

on:
  push:
    branches:
      - "evidence-pr11150-*-20260916210149"

permissions:
  contents: read

concurrency:
  group: pr11150-disk-gb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TINY_CACHE_ROOT: /mnt/pr11150-tiny
      ART_DIR: ${{ github.workspace }}/pr11150-artifacts
      PRIVATE_LOG_DIR: /tmp/pr11150-private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Record product diff vs upstream main
        run: |
          git log --oneline -3
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Install Studio from this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs
          set -o pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/install.log | tail -n 60

      - name: Install Playwright
        run: |
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1"
          python -m playwright install --with-deps chromium

      - name: Mount 1 GiB tmpfs for the HF cache
        run: |
          sudo mkdir -p "$TINY_CACHE_ROOT"
          sudo mount -t tmpfs -o size=1G,mode=0777 tmpfs "$TINY_CACHE_ROOT"
          df -B1 "$TINY_CACHE_ROOT"

      - name: Run Playwright probe
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python .github/scripts/pr11150_disk_gb_probe.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr11150-disk-gb-${{ github.ref_name }}
          path: ${{ github.workspace }}/pr11150-artifacts
          if-no-files-found: warn
