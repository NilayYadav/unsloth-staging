name: "staging-9214 ubuntu-latest"
on:
  push:
    branches: ["pr-9214-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/external_provider.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_openai_audio_speech_route.py'
      - 'studio/frontend/src/features/chat/adapters/studio-speech-synthesis-adapter.ts'
      - 'studio/frontend/src/features/chat/index.ts'
      - 'studio/frontend/src/features/settings/stores/voice-settings-store.ts'
      - 'studio/frontend/src/features/settings/tabs/voice-tab.tsx'
      - 'studio/frontend/src/i18n/locales/ar.ts'
      - 'studio/frontend/src/i18n/locales/de.ts'
      - 'studio/frontend/src/i18n/locales/en.ts'
      - 'studio/frontend/src/i18n/locales/es.ts'
      - 'studio/frontend/src/i18n/locales/fr.ts'
      - 'studio/frontend/src/i18n/locales/hi.ts'
      - 'studio/frontend/src/i18n/locales/it.ts'
      - 'studio/frontend/src/i18n/locales/ja.ts'
      - 'studio/frontend/src/i18n/locales/ko.ts'
      - 'studio/frontend/src/i18n/locales/pt-br.ts'
      - 'studio/frontend/src/i18n/locales/ru.ts'
      - 'studio/frontend/src/i18n/locales/zh-CN.ts'
      - '.github/workflows/staging-9214-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_openai_audio_speech_route.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
