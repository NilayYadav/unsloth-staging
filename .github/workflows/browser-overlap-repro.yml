name: Browser overlap repro (Linux / Windows Desktop)

on:
  push:
    branches: [browser-overlap-repro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    if: false
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tauri deps + WebDriver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf xvfb webkit2gtk-driver imagemagick
          cargo install tauri-driver --locked
      - name: Studio backend
        run: ./install.sh --local --no-torch
      - name: Build Desktop (debug)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          (cd studio/frontend && npm ci --no-fund --no-audit && npm run build)
          npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit
          npx --prefix studio tauri build --debug --no-bundle
      - name: Repro
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" python .github/scripts/browser_overlap_repro.py \
            --bin studio/src-tauri/target/debug/unsloth-studio --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlap-linux
          path: out/

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: websocket client
        run: python -m pip install websocket-client
      - name: Studio backend
        shell: pwsh
        run: |
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }
      - name: Build Desktop (debug)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $m = 'studio/src-tauri/src/main.rs'
          $src = Get-Content $m -Raw
          $hook = 'if let Some(args) = gpu_rendering::windows_main_browser_args(gpu_setting) {'
          if (-not $src.Contains($hook)) { throw "main window hook not found" }
          $mine = 'if let Some(window) = context.config_mut().app.windows.get_mut(0) { window.additional_browser_args = Some("--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222".into()); }'
          Set-Content $m ($src.Replace($hook, $mine + "`r`n    #[cfg(windows)]`r`n    " + $hook)) -NoNewline
          Select-String -Path $m -Pattern 'remote-debugging-port' | Select-Object -First 1
          Push-Location studio/frontend; npm ci --no-fund --no-audit; npm run build; Pop-Location
          npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit
          npx --prefix studio tauri build --debug --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
      - name: Repro
        shell: pwsh
        run: |
          python .github/scripts/browser_overlap_repro.py --bin studio/src-tauri/target/debug/unsloth-studio.exe `
            --out out --cdp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlap-windows
          path: out/
