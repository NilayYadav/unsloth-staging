# Disposable repro workflow for unslothai/unsloth#10936. Delete after validation.

name: "PR 10936 Docker local models A/B"

on:
  push:
    branches:
      - "pr-10936-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sh-tests:
    name: "run.sh tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Run the docker/run.sh tests with the system bash"
        shell: bash
        run: |
          python -m pip install pytest
          export PATH="/bin:$PATH"
          command -v bash && bash --version | head -1
          python -m pytest -q tests/python/test_docker_run_local_models.py \
            tests/python/test_docker_rocm.py tests/python/test_docker_cpu_fallback.py \
            tests/python/test_docker_nvidia_toolkit_install.py tests/python/test_docker_studio_home_volume.py

  studio:
    name: "Studio in Docker (${{ matrix.side }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    env:
      BASE_SHA: "8760d44374e5f094707d5c0e9e75560200db26b9"
      SIDE: ${{ matrix.side }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Free disk for the Studio image"
        shell: bash
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          root_free="$(df --output=avail -k / | tail -1)"
          mnt_free="$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)"
          if [[ "${mnt_free:-0}" -gt "$root_free" ]]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            sudo python3 -c 'import json, os; p = "/etc/docker/daemon.json"; d = json.load(open(p)) if os.path.exists(p) else {}; d["data-root"] = "/mnt/docker"; json.dump(d, open(p, "w"), indent = 2)'
            sudo cat /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          docker info --format 'docker root: {{.DockerRootDir}}'
          df -h / /mnt

      - name: "Pull unsloth/unsloth:latest"
        shell: bash
        run: |
          docker pull unsloth/unsloth:latest
          docker image inspect unsloth/unsloth:latest --format '{{index .RepoDigests 0}}' | tee image_digest.txt

      - name: "Seed host LM Studio, Hermes, Ollama and GGUF folders"
        shell: bash
        run: bash .github/pr10936/seed_host_models.sh

      - name: "Pick run.sh for this side"
        shell: bash
        run: |
          mkdir -p evidence
          if [[ "$SIDE" == before ]]; then
            git show "$BASE_SHA:docker/run.sh" > "$RUNNER_TEMP/run.sh"
          else
            cp docker/run.sh "$RUNNER_TEMP/run.sh"
          fi
          sha256sum "$RUNNER_TEMP/run.sh" docker/run.sh | tee evidence/run_sh_sha.txt

      - name: "Start Studio through run.sh"
        shell: bash
        run: |
          PW="$(python -c 'import secrets; print("Pr10936-" + secrets.token_urlsafe(18))')"
          echo "::add-mask::$PW"
          echo "STUDIO_PW=$PW" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          UNSLOTH_GPUS=none UNSLOTH_ALLOW_CPU=1 UNSLOTH_PORTS="-p 8000:8000" \
            UNSLOTH_STUDIO_PASSWORD="$PW" UNSLOTH_MODELS_DIR="$HOME/gguf-models" \
            nohup bash "$RUNNER_TEMP/run.sh" > "$GITHUB_WORKSPACE/evidence/run_sh_$SIDE.log" 2>&1 &
          sleep 20
          docker ps --format '{{.ID}} {{.Image}} {{.Status}}'
          head -20 "$GITHUB_WORKSPACE/evidence/run_sh_$SIDE.log"

      - name: "Record the container's mounts and model folders"
        shell: bash
        run: |
          for _ in $(seq 60); do CID="$(docker ps -q | head -1)"; [[ -n "$CID" ]] && break; sleep 2; done
          docker inspect "$CID" --format '{{json .Mounts}}' | python -m json.tool | tee "evidence/mounts_$SIDE.json"
          docker exec "$CID" sh -c 'for d in /root/.lmstudio/models /root/.ollama/models /root/.hermes/models /workspace/models; do printf "%s: " "$d"; if [ -d "$d" ]; then printf "%s files\n" "$(find "$d" -type f | wc -l)"; else echo absent; fi; done' | tee "evidence/container_dirs_$SIDE.txt"

      - name: "Install Playwright"
        shell: bash
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: "Probe Studio: list, load, chat, picker"
        shell: bash
        run: |
          set +e
          python .github/pr10936/probe.py "evidence/facts_$SIDE.json" 2>&1 | tee "evidence/probe_$SIDE.log"
          status=${PIPESTATUS[0]}
          {
            echo "## PR 10936 Docker ($SIDE): $(grep '^RESULT' "evidence/probe_$SIDE.log")"
            echo '~~~~text'
            cat "evidence/container_dirs_$SIDE.txt"
            tail -80 "evidence/probe_$SIDE.log"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: "Stop Studio"
        if: always()
        shell: bash
        run: |
          docker ps -q | xargs -r docker logs --tail 300 > "evidence/container_$SIDE.log" 2>&1 || true
          docker ps -q | xargs -r docker stop || true

      - name: "Upload evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr10936-${{ matrix.side }}
          path: evidence/
