# Branch-scoped A/B harness for unslothai/unsloth#10667. Not for upstream.
# The same probe runs on the "before" branch (fresh upstream main) and on the
# staged PR branch; only studio/backend/routes/rag.py differs between them.

name: PR 10667 filename A/B

on:
  push:
    branches:
      - "pr-10667-mimir-skill-e2e-pr-10667-20260909214552-ci"
      - "pr-10667-mimir-skill-e2e-pr-10667-20260909214552-before"

permissions:
  contents: read

concurrency:
  group: pr10667-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Uploaded name (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the backend import chain (no torch)
        # bash on every runner: the windows job defaults to pwsh, where a trailing
        # backslash is not a line continuation and the second line runs as a command.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests 'numpy<3' httpx

      - name: Which implementation is under test
        shell: bash
        run: |
          echo "branch: ${GITHUB_REF_NAME}"
          echo "sha:    ${GITHUB_SHA}"
          sed -n '/^def _sanitize_filename/,/^def _persist_upload_stream/p' studio/backend/routes/rag.py

      - name: Probe
        shell: bash
        env:
          PR10667_UPLOADS: ${{ runner.temp }}/pr10667-uploads
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python .github/scripts/pr10667_probe.py
