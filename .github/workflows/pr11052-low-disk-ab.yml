# Disposable A/B repro for unslothai/unsloth#11052. Delete after validation.

name: "PR 11052 low-disk GGUF fallback A/B"

on:
  push:
    branches:
      - "pr11052-ab-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-disk:
    name: "low-disk fallback (${{ github.ref_name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts
      HF_HUB_CACHE: /hfcache/hub
      LOW_DISK_BALLAST: /hfcache/ballast.bin
      AB_SIDE: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Free runner disk and mount a small HF cache volume
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt || true
          MNT_AVAIL=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 | tr -d ' ' || echo 0)
          IMG_DIR=/mnt; [ "${MNT_AVAIL:-0}" -gt 21474836480 ] || IMG_DIR="$RUNNER_TEMP"
          echo "loop image dir: $IMG_DIR"
          sudo truncate -s 16G "$IMG_DIR/hfcache.img"
          sudo mkfs.ext4 -F -q -m 0 "$IMG_DIR/hfcache.img"
          sudo mkdir -p /hfcache
          sudo mount -o loop "$IMG_DIR/hfcache.img" /hfcache
          sudo chown "$(id -u):$(id -g)" /hfcache
          echo "HF_HOME=$RUNNER_TEMP/hf-home" >> "$GITHUB_ENV"
          echo "HF_XET_CACHE=$RUNNER_TEMP/xet" >> "$GITHUB_ENV"
          mkdir -p /hfcache/hub "$RUNNER_TEMP/hf-home" "$RUNNER_TEMP/xet"
          df -B1 /hfcache

      - name: Install Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          python -m playwright install --with-deps chromium

      - name: Install Studio from this branch
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          bash ./install.sh --local --no-torch

      - name: Run low-disk probe
        shell: bash
        run: |
          cd .github/scripts
          python pr11052-low-disk-probe.py

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr11052-low-disk-${{ github.ref_name }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
