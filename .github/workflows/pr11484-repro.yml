name: "PR 11484 run.sh real-container repro"
on:
  push:
    branches: ["pr11484-repro-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /
      - name: Pull image
        run: docker pull -q unsloth/unsloth:latest && docker image inspect unsloth/unsloth:latest --format '{{index .RepoDigests 0}}'
      - name: Probe
        run: bash .github/pr11484_repro.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ github.ref_name }}
          path: evidence/
