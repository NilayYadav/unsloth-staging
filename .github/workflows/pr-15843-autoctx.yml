name: "PR 15843 Auto context on macOS"

on:
  push:
    branches:
      - "pr-15843-repro-base-ci"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-studio:
    name: "Studio smoke (${{ matrix.os }}, ${{ matrix.browser }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-15"]
        browser: ["chromium"]
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Playwright and its engine
        timeout-minutes: 33
        env:
          APT_ACQUIRE_RETRIES: '0'
        shell: bash
        run: |
          python -m pip install "playwright<2" "httpx>=0.27,<1" "pillow>=10,<13"
          python -m playwright install "${{ matrix.browser }}"
          if python -c "import os; from playwright.sync_api import sync_playwright; p = sync_playwright().start(); getattr(p, os.environ['STUDIO_BROWSER']).launch().close(); p.stop()"; then
            echo "::notice::${{ matrix.browser }} launches"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            bash .github/scripts/retry-with-apt-lock.sh python -m playwright install-deps "${{ matrix.browser }}"
          else
            echo "::error::${{ matrix.browser }} does not launch on $RUNNER_OS"; exit 1
          fi

      - name: Restore the uv download cache
        id: uv-cache
        uses: ./.github/actions/uv-cache-restore
      - name: Install Studio from this branch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_STUDIO_HOME | Out-Null
          & ./install.ps1 --local --no-torch
      - name: Install Studio from this branch (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          bash ./install.sh --local --no-torch
      - name: Save the uv download cache
        uses: ./.github/actions/uv-cache-save
        with:
          cache-hit: ${{ steps.uv-cache.outputs.cache-hit }}
          key: ${{ steps.uv-cache.outputs.key }}
          save: 'false'
      - name: Launch Studio and run the probe
        shell: bash
        env:
          PW_ENV_AUTO: '0'
        run: python ".github/scripts/pr-15843-autoctx-probe.py"
      - name: Show sanitized Studio logs
        if: failure()
        shell: bash
        run: |
          for f in "$STUDIO_ARTIFACT_DIR"/*.log; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f")"
            tail -150 "$f" | perl -pe 's/sk-unsloth-[A-Za-z0-9]+/sk-unsloth-REDACTED/g; s/((?:password|token|api[_ -]?key)[^:=\n]*[:=]\s*)\S+/$1REDACTED/gi'
          done
      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: studio-smoke-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            ${{ github.workspace }}/.studio-live/artifacts/**/*.png
            ${{ github.workspace }}/.studio-live/artifacts/**/*.webm
            ${{ github.workspace }}/.studio-live/artifacts/**/*.mp4
            ${{ github.workspace }}/.studio-live/artifacts/**/*.json
          if-no-files-found: warn
