# Disposable repro workflow. Delete after validation.

name: "PR 11048 A/B vision reasoning tests"

on:
  push:
    branches:
      - "pr11048-ab-*-20260915202026"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install backend test dependencies (same set as Backend CI)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests 'numpy<3' pytest pytest-asyncio pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"
          python -c 'import torch, transformers, peft; print("torch", torch.__version__, "transformers", transformers.__version__, "peft", peft.__version__)'

      - name: "Record the tested implementation"
        shell: bash
        run: |
          git rev-parse HEAD
          sha256sum studio/backend/core/inference/inference.py studio/backend/routes/inference.py studio/backend/tests/test_vision_client_tools.py studio/backend/tests/test_safetensors_reasoning_stream.py

      - name: "PR 11048 tests: image turns carry reasoning controls and repetition penalty"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_vision_client_tools.py tests/test_safetensors_reasoning_stream.py -q -rfEs --tb=short --timeout=330 -p no:cacheprovider

