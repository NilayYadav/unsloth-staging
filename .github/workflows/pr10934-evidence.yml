name: "PR 10934 top_p repro and UI evidence"

on:
  push:
    branches: ["pr-10934-pr10934-20260914202628-ci"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr10934-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 5c04ec19305ecb5f0153c5b4d806a9d7e6e4422d
  HEAD_SHA: b78f181210e8d17466368f9507db2b8573fb17a0

jobs:
  repro:
    name: "Backend A/B: merge base vs PR head (fake gateway)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Fetch merge base and PR head trees
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/unslothai/unsloth.git "$RUNNER_TEMP/up"
          cd "$RUNNER_TEMP/up"
          git fetch --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/head" "$HEAD_SHA"
          echo "base=$(git -C "$RUNNER_TEMP/base" rev-parse HEAD) head=$(git -C "$RUNNER_TEMP/head" rev-parse HEAD)"
          cp "$RUNNER_TEMP/head/studio/backend/tests/test_external_top_p_omission.py" "$RUNNER_TEMP/base/studio/backend/tests/"
      - name: Install backend test dependencies (same set as Backend CI)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/head"
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-timeout httpx soundfile librosa
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"
      - name: "NEGATIVE: merge base must fail on the top_p assertions"
        shell: bash
        working-directory: ${{ runner.temp }}/base/studio/backend
        run: |
          set +e
          python -m pytest tests/test_external_top_p_omission.py -q -rA --tb=line -p no:cacheprovider --timeout=300 2>&1 | tee "$RUNNER_TEMP/negative.txt"
          code=${PIPESTATUS[0]}
          set -e
          echo "negative exit=$code"
          test "$code" -ne 0
          grep -E "FAILED .*test_an_omitted_top_p_is_not_forwarded_and_the_gateway_accepts" "$RUNNER_TEMP/negative.txt"
          grep -E "FAILED .*test_the_connection_test_ping_omits_top_p" "$RUNNER_TEMP/negative.txt"
          grep -E "PASSED .*test_an_explicit_top_p_still_reaches_the_gateway" "$RUNNER_TEMP/negative.txt"
          echo "REPRO OK: merge base forwards top_p when the client left it out"
      - name: "POSITIVE: PR head must pass"
        shell: bash
        working-directory: ${{ runner.temp }}/head/studio/backend
        run: |
          python -m pytest tests/test_external_top_p_omission.py -q -rA --tb=short -p no:cacheprovider --timeout=300

  ui-evidence:
    name: "Studio UI before/after (Chromium, fake LiteLLM gateway)"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Free runner disk
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13" pytest
          python -m playwright install --with-deps chromium
      - name: Clone upstream at both refs
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/unslothai/unsloth.git "$RUNNER_TEMP/unsloth"
          git -C "$RUNNER_TEMP/unsloth" fetch origin "$BASE_SHA" "$HEAD_SHA"
      - name: Evidence harness offline guards
        shell: bash
        run: |
          U=.evidence/skills/pr-ui-evidence/scripts
          python -m pytest "$U/pr_ui_scenes/test_pr_ui_diff_guards.py" "$U/pr_ui_scenes/test_pr_ui_diff_refs.py" \
            "$U/pr_ui_scenes/test_pr_ui_diff_skip_install.py" -q
      - name: Install both sides, drive the scene, compose BEFORE|AFTER
        shell: bash
        run: |
          set -euo pipefail
          python .evidence/skills/pr-ui-evidence/scripts/pr_ui_diff.py --pr 10934 \
            --repo "$RUNNER_TEMP/unsloth" --root "$RUNNER_TEMP/ui" \
            --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"
      - name: Collect shareable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/share"
          cd "$RUNNER_TEMP/ui" || exit 0
          cp -r combined before after meta.json "$RUNNER_TEMP/share/" 2>/dev/null || true
          cp before_studio.log after_studio.log "$RUNNER_TEMP/share/" 2>/dev/null || true
          find "$RUNNER_TEMP/share" -maxdepth 2 -type f | sort
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr10934-ui-evidence
          path: ${{ runner.temp }}/share
          if-no-files-found: warn
