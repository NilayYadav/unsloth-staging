name: PR 11289 desktop auth UI evidence

on:
  push:
    branches:
      - pr-11289-pr11289-abrepro-20260919221632-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr11289-ui-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: desktop UI ${{ matrix.side }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux native deps for Tauri / WebKit2GTK
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb || { apt-get update && apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - name: Install tauri-driver and selenium
        run: |
          cargo install tauri-driver --locked
          python3 -m pip install --upgrade 'selenium==4.49.0'

      - name: Lockfile supply-chain audit (pre-install scan)
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: Frontend build (npm ci, vite)
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
          test -f dist/index.html

      # Both sides build the same commit, the same frontend bundle and run the
      # same probe. `before` only reverts the PR's production change.
      - name: Revert the PR implementation (before side only)
        if: matrix.side == 'before'
        run: python3 .github/scripts/pr11289-revert-fix.py

      - name: Show the implementation under test
        run: sed -n '195,235p' studio/src-tauri/src/desktop_auth.rs

      - name: Build the desktop binary
        run: cargo build --locked --manifest-path studio/src-tauri/Cargo.toml

      - name: Drive the desktop app against a 7s-delayed backend
        id: probe
        continue-on-error: true
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x900x24" python3 .github/scripts/pr11289-desktop-evidence.py \
            "${{ matrix.side }}" studio/src-tauri/target/debug/unsloth-studio "$GITHUB_SHA"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Assert the predeclared expectation
        env:
          SIDE: ${{ matrix.side }}
          STATUS: ${{ steps.probe.outputs.status }}
        run: |
          meta="evidence/$SIDE/meta.json"
          test -f "$meta" || { echo "::error::probe produced no meta.json"; exit 1; }
          python3 - "$meta" "$SIDE" "$STATUS" <<'PY'
          import json, sys
          meta, side, status = sys.argv[1], sys.argv[2], sys.argv[3]
          facts = json.loads(open(meta).read())
          print(json.dumps(facts, indent=2)[:4000])
          assert facts["auth_requests"] >= 1, "no desktop-login request reached the fixture"
          if side == "after":
              assert status == "0", f"after side failed: exit {status}"
              assert facts["login_form_visible"] and not facts["startup_error_visible"], facts
              print("PASS after: the delayed backend still completes desktop auth and the login UI mounts")
          else:
              assert status != "0", "before side unexpectedly succeeded"
              assert facts["startup_error_visible"] and not facts["login_form_visible"], facts
              print("PASS before: the delayed backend leaves the desktop app on the startup error screen")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v5
        with:
          name: pr11289-ui-${{ matrix.side }}
          path: evidence/${{ matrix.side }}
