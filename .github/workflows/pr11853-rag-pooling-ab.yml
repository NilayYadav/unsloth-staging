name: "PR 11853 RAG pooling A/B"

on:
  push:
    branches:
      - "pr11853-ab-*"

permissions:
  contents: read

concurrency:
  group: pr11853-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      STUDIO_PORT: "18888"
      OUT_DIR: ${{ github.workspace }}/pr11853-out
      SIDE: ${{ contains(github.ref_name, '-before-') && 'before' || 'after' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Linux deps for llama.cpp prebuilt
        run: sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Playwright
        run: |
          python -m pip install playwright huggingface_hub
          python -m playwright install --with-deps chromium

      - name: Boot Studio
        run: |
          mkdir -p "$OUT_DIR"
          rm -rf "$HOME/.unsloth/studio/auth"
          nohup unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" > "$OUT_DIR/studio.log" 2>&1 &
          for i in $(seq 1 180); do
            curl -fs "http://127.0.0.1:$STUDIO_PORT/api/health" >/dev/null && break
            sleep 2
          done
          curl -fs "http://127.0.0.1:$STUDIO_PORT/api/health"
          for i in $(seq 1 60); do
            [ -s "$HOME/.unsloth/studio/auth/.bootstrap_password" ] && break
            sleep 1
          done

      - name: Probe
        run: python .github/scripts/pr11853_rag_probe.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr11853-${{ env.SIDE }}
          path: |
            pr11853-out/*.png
            pr11853-out/*.json
            pr11853-out/studio.log
