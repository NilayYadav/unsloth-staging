# Disposable repro workflow. Delete after validation.

name: "PR 11301 shared-cache reproduction"

on:
  push:
    branches:
      - "pr-11301-proof-20260918-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio

      - name: "Provenance and cache containment regressions"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_training_provenance.py -q -rA --tb=short --junitxml=../../provenance-results.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provenance-results
          path: provenance-results.xml
