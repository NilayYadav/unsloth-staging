name: "PR 11857 push_to_hub_gguf A/B"

on:
  push:
    branches: ['pr11857-ab-*']

permissions:
  contents: read

jobs:
  probe:
    name: "push_to_hub_gguf probe"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PYTHONPATH: ${{ github.workspace }}/studio
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      HF_HUB_OFFLINE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Core CPU setup
        uses: ./.github/actions/core-cpu-setup
        with:
          transformers-spec: __from_pyproject__
          trl-spec: __from_pyproject__
          unsloth-zoo-ref: main
      - name: Versions
        run: |
          git log -1 --format='tested tree %H %s'
          python -c "import huggingface_hub, transformers; print('huggingface_hub', huggingface_hub.__version__, 'transformers', transformers.__version__)"
      - name: A/B probe (real unsloth_push_to_hub_gguf + real HfApi.upload_file, stateful fake Hub transport)
        run: |
          echo "| scenario | commits | PRs opened | error | printed destination |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          python -m pytest -v -s --tb=short -p no:cacheprovider tests/test_pr11857_ab_probe.py
      - name: PR regression test
        if: always()
        run: |
          if [ -f tests/saving/test_push_to_hub_gguf_single_commit.py ]; then
            python -m pytest -v --tb=short tests/saving/test_push_to_hub_gguf_single_commit.py
          else
            echo "PR test file absent on this tree"
          fi

  hub-floor:
    name: "huggingface_hub 0.34.0 API surface"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: |
          pip install "huggingface_hub==0.34.0"
          python - <<'PY'
          import inspect
          from huggingface_hub import CommitInfo, CommitOperationAdd, HfApi, __version__
          from huggingface_hub.errors import HfHubHTTPError
          assert "exist_ok" in inspect.signature(HfApi.create_branch).parameters
          ps = inspect.signature(HfApi.create_commit).parameters
          assert {"operations", "commit_message", "commit_description", "create_pr", "revision"} <= set(ps)
          assert "pr_url" in {f for f in CommitInfo.__dataclass_fields__}
          print("huggingface_hub", __version__, "API surface OK")
          PY
