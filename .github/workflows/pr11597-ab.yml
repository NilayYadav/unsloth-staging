# Disposable repro workflow. Delete after validation.

name: "PR 11597 Alpaca AI Assist A/B"

on:
  push:
    branches:
      - "ab-11597-*-20260922224327"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install backend test deps (CPU, same shape as Backend CI)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 requests 'numpy<3' pytest pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'

      - name: "PR tests + end-to-end Alpaca AI Assist repro"
        shell: bash
        run: |
          set +e
          (cd studio/backend && python -m pytest -q --tb=line -p no:cacheprovider tests/test_alpaca_ai_assist_mapping.py); t=$?
          python .github/pr11597/probe_assert.py; p=$?
          echo "REPRO_RESULT pytest_rc=$t probe_rc=$p"
          exit $(( t || p ))

