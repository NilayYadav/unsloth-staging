name: PR 14290 desktop browser panel e2e

on:
  push:
    branches: [pr-14290-desktop-e2e-ci]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr14290-desktop-e2e-iter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e ${{ matrix.os }} ${{ matrix.arm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        arm: [head, baseline]
    env:
      PR_REPO: NilayYadav/unsloth
      HEAD_SHA: 3e2222ea8afdac4a5dfd19ab7f23d835c6585569
      BASELINE_SHA: 1c8cc5c005
      ART: ${{ github.workspace }}/e2e-art
      E2E_BACKEND_FIXTURE: ${{ github.workspace }}/.github/pr14290-e2e/backend_fixture.py
      E2E_BACKEND_LOG: ${{ github.workspace }}/e2e-art/backend-requests.jsonl
      E2E_STUB_LOG: ${{ github.workspace }}/e2e-art/stub-cli.jsonl
      TAURI_SIGNING_PRIVATE_KEY: ''
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pick the ref under test
        id: ref
        shell: bash
        run: |
          if [ "${{ matrix.arm }}" = head ]; then echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"; else echo "sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"; fi
          mkdir -p "$ART"
          echo "reuse=$(tr -d '[:space:]' < .github/pr14290-e2e/reuse_run 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Check out the PR code under test
        shell: bash
        run: |
          git init -q src
          git -C src remote add origin "https://github.com/$PR_REPO.git"
          git -C src fetch -q --depth 1 origin "${{ steps.ref.outputs.sha }}" || git -C src fetch -q origin browser-panel-localhost-grants
          git -C src checkout -q "${{ steps.ref.outputs.sha }}"
          git -C src log --oneline -1

      - name: Linux native deps for Tauri, WebKitWebDriver and input
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb xauth webkit2gtk-driver xdotool imagemagick || { apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb xauth webkit2gtk-driver xdotool imagemagick; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src/studio/src-tauri -> target
          key: ${{ matrix.arm }}

      - name: Install tauri-driver
        shell: bash
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Reuse a binary from an earlier run
        if: steps.ref.outputs.reuse != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: app-${{ matrix.os }}-${{ matrix.arm }}
          path: app-bin
          run-id: ${{ steps.ref.outputs.reuse }}
          github-token: ${{ github.token }}

      - name: Build the desktop app (debug, no bundle)
        if: steps.ref.outputs.reuse == ''
        shell: bash
        run: |
          (cd src && python scripts/lockfile_supply_chain_audit.py)
          cd src
          npm ci --prefix studio --no-fund --no-audit
          (cd studio/frontend && npm ci --no-fund --no-audit)
          npx --prefix studio tauri build --debug --no-bundle
          cd ..
          mkdir -p app-bin
          if [ "$RUNNER_OS" = Windows ]; then cp src/studio/src-tauri/target/debug/unsloth-studio.exe app-bin/; else cp src/studio/src-tauri/target/debug/unsloth-studio app-bin/; fi
          ls -la app-bin

      - name: Upload the built binary for reruns
        if: steps.ref.outputs.reuse == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-${{ matrix.os }}-${{ matrix.arm }}
          path: app-bin
          retention-days: 2

      - name: Stub backend (Linux)
        if: runner.os == 'Linux'
        run: |
          bin="$HOME/.unsloth/studio/unsloth_studio/bin"
          mkdir -p "$bin"
          printf '#!/usr/bin/env bash\nexec python3 %s "$@"\n' "$GITHUB_WORKSPACE/.github/pr14290-e2e/stub_cli.py" > "$bin/unsloth"
          chmod +x "$bin/unsloth" app-bin/unsloth-studio
          cat "$bin/unsloth"

      - name: Stub backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $venv = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio'
          python -m venv $venv
          $pkg = Join-Path $venv 'Lib\site-packages\unsloth_cli'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item .github/pr14290-e2e/stub_cli.py (Join-Path $pkg '__init__.py')
          Copy-Item (Join-Path $venv 'Scripts\python.exe') (Join-Path $venv 'Scripts\unsloth.exe')
          & (Join-Path $venv 'Scripts\python.exe') -c "import sys; sys.argv=['unsloth','desktop-capabilities','--json']; from unsloth_cli import app; sys.exit(app())"

      - name: Matching msedgedriver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $wv = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          Write-Host "WebView2 runtime: $wv"
          $edge = (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
          Write-Host "Edge: $edge"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $ok = $false
          foreach ($base in @('https://msedgedriver.microsoft.com', 'https://msedgedriver.azureedge.net')) {
            try {
              Invoke-WebRequest "$base/$wv/edgedriver_win64.zip" -OutFile "$dir\d.zip" -TimeoutSec 120
              Expand-Archive "$dir\d.zip" -DestinationPath $dir -Force
              $ok = $true; break
            } catch { Write-Host "download from $base failed: $_" }
          }
          if (-not $ok) { Copy-Item (Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe') $dir }
          & "$dir\msedgedriver.exe" --version
          "NATIVE_DRIVER=$dir\msedgedriver.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run the scenarios (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python .github/pr14290-e2e/e2e_driver.py --app "$env:GITHUB_WORKSPACE\app-bin\unsloth-studio.exe" --native-driver $env:NATIVE_DRIVER --art $env:ART --arm ${{ matrix.arm }}

      - name: Run the scenarios (Linux)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            python .github/pr14290-e2e/e2e_driver.py --app "$GITHUB_WORKSPACE/app-bin/unsloth-studio" --native-driver "$(command -v WebKitWebDriver)" --art "$ART" --arm ${{ matrix.arm }}

      - name: Collect app logs
        if: always()
        shell: bash
        run: |
          for f in "$HOME/.unsloth/studio/tauri.log" "$USERPROFILE/.unsloth/studio/tauri.log"; do
            [ -f "$f" ] && cp "$f" "$ART/tauri.log" && tail -80 "$f"
          done
          ls -la "$ART" || true
          cat "$ART/results.json" 2>/dev/null | head -400 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.arm }}
          path: e2e-art
          retention-days: 7
          if-no-files-found: warn
