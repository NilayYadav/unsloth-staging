# Disposable repro workflow. Delete after validation.

name: "PR 11050 merged Hub push A/B"

on:
  push:
    branches:
      - "pr11050-ab-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install backend test dependencies (CPU only)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install 'numpy<3' pytest pytest-asyncio pytest-timeout httpx

      - name: "Show which export.py this branch carries"
        shell: bash
        run: |
          git log -1 --format='%H %s'
          grep -n 'elif (is_compressed or is_torchao) and output_path\|save_dir_was_empty\|elif output_path and Path(output_path).is_dir()' studio/backend/core/export/export.py || true

      - name: "PR 11050 merged Hub push tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest -v --tb=short -p no:cacheprovider --timeout=330 tests/test_export_hub_push.py tests/test_export_imatrix_compressed.py tests/test_export_gguf_hub_upload.py

