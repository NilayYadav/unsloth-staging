name: "PR 10935 nested tool-call key order A/B"

on:
  push:
    branches: ['pr10935-ab-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr10935-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyorder:
    name: "start_cursor survives out-of-order (Qwen3.5-2B GGUF, real Studio)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      HF_XET_CACHE: ${{ github.workspace }}/xet-scratch
      HF_HOME: ${{ github.workspace }}/hf-cache-tools
      GGUF_REPO: unsloth/Qwen3.5-2B-GGUF
      GGUF_FILE: Qwen3.5-2B-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18889'
      UNSLOTH_STUDIO_ALLOW_STDIO_MCP: '1'
      SIDE_LABEL: ${{ contains(github.ref_name, 'reverted') && 'BEFORE (fix reverted)' || 'AFTER (PR head)' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps for llama.cpp prebuilt
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Unsloth (--local, --no-torch)
        id: install
        timeout-minutes: 30
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          hf-token: ''

      - name: Download GGUF
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache-tools
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache-tools

      - name: Boot Studio (loopback, with frontend)
        timeout-minutes: 5
        run: bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT" --log logs/studio.log

      - name: Health, rotate password, load model
        timeout-minutes: 20
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIKeyOrder-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          echo "::add-mask::$OLD_TOKEN"
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          echo "STUDIO_PASSWORD=$NEW" >> "$GITHUB_ENV"
          curl -fs -o /dev/null -w 'chat page HTTP %{http_code}\n' "http://127.0.0.1:${STUDIO_PORT}/chat"
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 900 \
            -d "{\"model_path\":\"$GITHUB_WORKSPACE/gguf-cache-tools/${GGUF_FILE}\",\"is_lora\":false,\"max_seq_length\":16384}" \
            | jq '{status, display_name, context_length}'

      - name: Playwright
        timeout-minutes: 10
        run: |
          python -m pip install 'playwright>=1.45,<2'
          python -m playwright install --with-deps chromium

      - name: Probe nested key order (API passthrough + chat UI tool loop)
        timeout-minutes: 30
        env:
          BASE_URL: http://127.0.0.1:18889
          OUT_DIR: pr10935-evidence
          STUB_PATH: .github/scripts/pr10935_notion_stub_mcp.py
          STUB_LOG: /tmp/pr10935_stub_calls.jsonl
        run: python .github/scripts/pr10935_keyorder_probe.py

      - name: Studio log tail
        if: always()
        run: tail -n 80 logs/studio.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr10935-evidence-${{ github.ref_name }}
          path: pr10935-evidence/
          if-no-files-found: warn
          retention-days: 14
