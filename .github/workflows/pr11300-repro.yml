# Disposable repro workflow. Delete after validation.

name: "PR 11300 real HF recipe A-B"

on:
  push:
    branches:
      - "pr-11300-evidence-20260919"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Real validator (${{ matrix.side }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: before
            ref: 768d644036a948441ba80b626c9e747c1fecfbae
          - side: after
            ref: 7bf15c0fa42c78d8b6f1c547c7ccc84331e7ffd4
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/runtime/studio-${{ matrix.side }}
      HF_HOME: ${{ github.workspace }}/runtime/hf-${{ matrix.side }}
      HF_ENDPOINT: https://huggingface.co
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: unslothai/unsloth
          ref: ${{ matrix.ref }}
          path: target
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install real recipe dependencies"
        shell: bash
        run: |
          python -m pip install uv
          uv pip install --system -r target/studio/backend/requirements/studio.txt -r target/studio/backend/requirements/single-env/data-designer-deps.txt pytest python-multipart
          uv pip install --system --no-deps -r target/studio/backend/requirements/single-env/data-designer.txt
          python target/studio/backend/requirements/single-env/patch_metadata.py

      - name: "Real HF endpoint validation and two-row generation"
        shell: bash
        run: |
          python .github/pr11300/repro.py target

      - name: "Recipe seed regression tests"
        shell: bash
        run: |
          python -m pytest target/studio/backend/tests/test_data_recipe_seed.py -q
