# Disposable repro workflow. Delete after validation.

name: "PR 11300 real HF recipe A-B"

on:
  push:
    branches:
      - "pr-11300-evidence-20260919"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Real validator (${{ matrix.side }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: before
            ref: ef00d4946731d2cb9bed2982f1a24346843e7e19
          - side: after
            ref: 78f8e81715d1f302c1a3efcbc92fa80403bbb23d
    env:
      UNSLOTH_STUDIO_HOME: ${{ runner.temp }}/studio-${{ matrix.side }}
      HF_HOME: ${{ runner.temp }}/hf-${{ matrix.side }}
      HF_ENDPOINT: https://huggingface.co
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: unslothai/unsloth
          ref: ${{ matrix.ref }}
          path: target
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install real recipe dependencies"
        shell: bash
        run: |
          python -m pip install uv
          uv pip install --system -r target/studio/backend/requirements/studio.txt -r target/studio/backend/requirements/single-env/data-designer.txt pytest python-multipart

      - name: "Real HF endpoint validation and two-row generation"
        shell: bash
        run: |
          python .github/pr11300/repro.py target

      - name: "Recipe seed regression tests"
        shell: bash
        run: |
          python -m pytest target/studio/backend/tests/test_data_recipe_seed.py -q
