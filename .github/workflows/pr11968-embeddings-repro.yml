# Disposable PR 11968 repro workflow. Delete after validation.

name: "PR 11968 embeddings dimensions repro"

on:
  push:
    branches:
      - "pr11968-repro-head"
      - "pr11968-repro-reverted"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "embeddings dimensions (${{ github.ref_name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts
      PROBE_SIDE: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Studio from this branch
        shell: bash
        run: |
          python -m pip install -q "huggingface_hub>=0.34"
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          bash ./install.sh --local --no-torch

      - name: Run embeddings dimensions probe
        shell: bash
        run: python .github/scripts/pr11968-embeddings-probe.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr11968-${{ github.ref_name }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
