# Disposable repro workflow for unslothai/unsloth#11045. Delete after validation.

name: "PR 11045 Docker Studio port A/B"

on:
  push:
    branches:
      - "pr-11045-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: "port tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Run the Studio port tests with the system bash"
        shell: bash
        run: |
          python -m pip install pytest
          export PATH="/bin:$PATH"
          command -v bash && bash --version | head -1
          python -m pytest -q tests/python/test_docker_studio_port.py \
            tests/python/test_docker_studio_launch_port_guard.py

  studio:
    name: "Studio in Docker, --network host (${{ matrix.side }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    env:
      BASE_SHA: "56d19467ebce9e59ec18e298bdf16a5a63da2445"
      SIDE: ${{ matrix.side }}
      IMAGE: "unsloth/unsloth:latest"
      PORT: "9000"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Free disk for the Studio image"
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          root_free="$(df --output=avail -k / | tail -1)"
          mnt_free="$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)"
          if [[ "${mnt_free:-0}" -gt "$root_free" ]]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            sudo python3 -c 'import json, os; p = "/etc/docker/daemon.json"; d = json.load(open(p)) if os.path.exists(p) else {}; d["data-root"] = "/mnt/docker"; json.dump(d, open(p, "w"), indent = 2)'
            sudo systemctl start docker
          fi
          df -h / /mnt

      - name: "Pull the published image"
        shell: bash
        run: |
          docker pull "$IMAGE"
          mkdir -p evidence
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee evidence/image_digest.txt

      - name: "Pick the launcher scripts for this side"
        shell: bash
        run: |
          S="$RUNNER_TEMP/scripts"; mkdir -p "$S"
          for f in studio_launch.sh studio_run.sh studio_password.sh; do
            if [[ "$SIDE" == before ]]; then git show "$BASE_SHA:docker/$f" > "$S/$f"; else cp "docker/$f" "$S/$f"; fi
            chmod 755 "$S/$f"
          done
          sha256sum "$S"/* | tee evidence/scripts_sha_$SIDE.txt
          {
            echo "-v $S/studio_launch.sh:/usr/local/bin/unsloth-studio-launch:ro"
            echo "-v $S/studio_run.sh:/usr/local/bin/unsloth-studio-run:ro"
            echo "-v $S/studio_password.sh:/usr/local/bin/unsloth-studio-password:ro"
          } | tr '\n' ' ' > "$RUNNER_TEMP/mounts"

      - name: "Start Studio with UNSLOTH_STUDIO_PORT=9000 on the host network"
        shell: bash
        run: |
          PW="$(python3 -c 'import secrets; print("Pr11045-" + secrets.token_urlsafe(18))')"
          echo "::add-mask::$PW"
          # shellcheck disable=SC2046
          docker run -d --name studio --network host \
            -e UNSLOTH_STUDIO_PORT="$PORT" -e UNSLOTH_STUDIO_PASSWORD="$PW" \
            $(cat "$RUNNER_TEMP/mounts") "$IMAGE" | tee evidence/cid.txt

      - name: "Wait until Studio answers on any port"
        shell: bash
        run: |
          for i in $(seq 1 180); do
            for p in "$PORT" 8000 8001; do
              if curl -fsS --noproxy '*' -o /dev/null "http://127.0.0.1:$p/api/health"; then
                echo "Studio healthy on $p after $((i * 5))s" | tee evidence/first_healthy_$SIDE.txt
                exit 0
              fi
            done
            docker inspect -f '{{.State.Running}}' studio | grep -q true || { docker logs --tail 200 studio; echo "container exited"; exit 1; }
            sleep 5
          done
          docker logs --tail 200 studio
          echo "Studio never answered on $PORT, 8000 or 8001"; exit 1

      - name: "Assert Studio honours UNSLOTH_STUDIO_PORT"
        shell: bash
        run: |
          sleep 15
          code() { curl -s --noproxy '*' -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:$1/api/health" || true; }
          on_port="$(code "$PORT")"; on_8000="$(code 8000)"
          banner="$(docker logs studio 2>&1 | grep -E 'Unsloth Studio  ->|Studio      http' | sed 's/\x1b\[[0-9;]*m//g' | head -3)"
          listeners="$(docker exec studio sh -c 'ss -ltnp 2>/dev/null | grep -E ":(8000|8001|9000|8888) " || true')"
          {
            echo "side=$SIDE"
            echo "GET :$PORT/api/health -> ${on_port:-000}"
            echo "GET :8000/api/health -> ${on_8000:-000}"
            echo "banner:"; echo "$banner"
            echo "listeners:"; echo "$listeners"
          } | tee "evidence/facts_$SIDE.txt"
          {
            echo "## PR 11045 Docker Studio port ($SIDE)"
            echo '~~~~text'; cat "evidence/facts_$SIDE.txt"; echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          [[ "$on_port" == 200 ]] || { echo "::error::Studio is not answering on UNSLOTH_STUDIO_PORT=$PORT (got ${on_port:-000})"; fail=1; }
          [[ "$on_8000" == 000 ]] || { echo "::error::Something still answers on 8000 (got $on_8000)"; fail=1; }
          grep -q "http://localhost:$PORT" <<< "$banner" || { echo "::error::The ready banner does not point at :$PORT"; fail=1; }
          [[ "$fail" == 0 ]] && echo "PASS: Studio on :$PORT, nothing on :8000, banner points at :$PORT"
          exit "$fail"

      - name: "Assert bad ports are refused at startup"
        if: always()
        shell: bash
        run: |
          fail=0
          refuse() {
            local label="$1"; shift
            local name="refuse-$RANDOM"
            set +e
            # shellcheck disable=SC2046
            out="$(timeout 120 docker run --name "$name" --network none "$@" $(cat "$RUNNER_TEMP/mounts") "$IMAGE" 2>&1)"
            rc=$?
            docker rm -f "$name" >/dev/null 2>&1
            set -e
            msg="$(sed 's/\x1b\[[0-9;]*m//g' <<< "$out" | grep -m1 'UNSLOTH_STUDIO_PORT' || true)"
            echo "$label -> exit $rc: ${msg:-<no UNSLOTH_STUDIO_PORT error>}" | tee -a "evidence/refusals_$SIDE.txt"
            [[ "$rc" != 0 && "$rc" != 124 && -n "$msg" ]] || fail=1
          }
          refuse "UNSLOTH_STUDIO_PORT=abc" -e UNSLOTH_STUDIO_PORT=abc
          refuse "UNSLOTH_STUDIO_PORT=18446744073709551617" -e UNSLOTH_STUDIO_PORT=18446744073709551617
          refuse "UNSLOTH_STUDIO_PORT=22 with SSH_KEY" -e UNSLOTH_STUDIO_PORT=22 -e SSH_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPr11045 ci"
          { echo '~~~~text'; cat "evidence/refusals_$SIDE.txt"; echo '~~~~'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

      - name: "Collect logs and stop Studio"
        if: always()
        shell: bash
        run: |
          docker logs studio 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -v -i -E 'password' | tail -300 > "evidence/container_$SIDE.log" || true
          docker rm -f studio || true

      - name: "Upload evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr11045-${{ matrix.side }}
          path: evidence/
