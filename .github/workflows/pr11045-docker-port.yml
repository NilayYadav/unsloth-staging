# Disposable repro workflow for unslothai/unsloth#11045. Delete after validation.

name: "PR 11045 Studio port tests"

on:
  push:
    branches:
      - "pr-11045-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: "port tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Run the Studio port tests with the system bash"
        shell: bash
        run: |
          python -m pip install pytest
          PY="$(command -v python)"
          export PATH="/bin:$PATH"
          command -v bash && bash --version | head -1
          "$PY" -m pytest -q tests/python/test_docker_studio_port.py \
            tests/python/test_docker_studio_launch_port_guard.py

