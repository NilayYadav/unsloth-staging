name: "staging-7652 macos-14"
on:
  push:
    branches: ["pr-7652-xplat-ci"]
    paths:
      - 'studio/backend/cloudflare_tunnel.py'
      - 'studio/backend/colab.py'
      - 'studio/backend/preview_public_server.py'
      - 'studio/backend/preview_share_link.py'
      - 'studio/backend/routes/settings.py'
      - 'studio/backend/run.py'
      - 'studio/backend/tests/test_cloudflare_tunnel.py'
      - 'studio/backend/tests/test_colab_embed.py'
      - 'studio/backend/tests/test_preview_public_server.py'
      - 'studio/backend/tests/test_preview_sharing_settings.py'
      - 'studio/frontend/src/features/settings/api/preview-sharing.ts'
      - 'studio/frontend/src/features/settings/index.ts'
      - 'studio/frontend/src/features/settings/settings-search.ts'
      - 'studio/frontend/src/features/settings/stores/preview-link-store.ts'
      - 'studio/frontend/src/features/settings/tabs/general-tab.tsx'
      - 'studio/frontend/src/features/studio/history-card-grid.tsx'
      - 'studio/frontend/src/i18n/locales/en.ts'
      - '.github/workflows/staging-7652-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_cloudflare_tunnel.py studio/backend/tests/test_colab_embed.py studio/backend/tests/test_preview_public_server.py studio/backend/tests/test_preview_sharing_settings.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
