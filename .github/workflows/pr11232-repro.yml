# Disposable repro workflow. Delete after validation.

name: "PR 11232 save-steps-zero repro"

on:
  push:
    branches:
      - "pr-11232-*-ab-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install CPU deps"
        shell: bash
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q transformers accelerate
          python -c "import torch,transformers;print('torch',torch.__version__,'transformers',transformers.__version__)"

      - name: "PR 11232 repro: Save Steps 0 must write no checkpoints"
        shell: bash
        run: |
          export PROBE_REPO="$GITHUB_WORKSPACE"
          export PROBE_OUT="$GITHUB_WORKSPACE/probe_out"
          export PROBE_MAX_STEPS=600
          set +e
          python ci/pr11232_probe.py 2>&1 | tee probe.log
          status=${PIPESTATUS[0]}
          set -e
          echo '--- checkpoint directory listing (evidence) ---'
          if [ -d "$PROBE_OUT" ]; then ls -la "$PROBE_OUT"; else echo 'no probe_out directory'; fi
          echo "--- probe exit status: $status ---"
          exit $status

