name: "staging-9304 windows-latest"
on:
  push:
    branches: ["pr-9304-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/mcp_client.py'
      - 'studio/backend/tests/test_mcp_stdio_node_path.py'
      - 'studio/backend/utils/node_runtime.py'
      - '.github/workflows/staging-9304-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install fastmcp pytest
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_mcp_stdio_node_path.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda and not TestBashBlocklistPosition and not test_program_roots_fails_closed_without_known_folder_api and not test_page_escapes_title and not test_preview_same_target_compares_case_sensitively and not test_setup_ps1_routing_matches_setup_sh and not test_setup_sh_cleanup_unlinks_instruction_symlink_only and not test_diffusion_visual_server_uses_approved_checksum_download' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
