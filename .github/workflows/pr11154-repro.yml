# Disposable repro workflow. Delete after validation.

name: "PR 11154 tool-call cap repro"

on:
  push:
    branches:
      - "pr11154-ab-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install backend test dependencies (CPU only, same as Backend CI)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests 'numpy<3' pytest pytest-asyncio pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'

      - name: "Source under test"
        shell: bash
        run: |
          git log --oneline -1
          git diff --stat 06dfb2059ab313c3d7a49b5641ee8170daebf57a HEAD -- studio/backend/core

      - name: "Repro probe: 10 tool calls in one turn (GGUF + safetensors)"
        shell: bash
        working-directory: studio/backend
        run: |
          python -m pytest tests/test_pr11154_probe.py -s -q -p no:cacheprovider --tb=short

      - name: "PR tests: per-turn cap"
        if: always()
        shell: bash
        working-directory: studio/backend
        run: |
          python -m pytest -q --tb=line tests/test_llama_cpp_tool_loop.py tests/test_safetensors_tool_loop.py -k 'cap or capped'

      - name: "PR test files in full"
        if: always()
        shell: bash
        working-directory: studio/backend
        run: |
          python -m pytest -q --tb=line --timeout=330 tests/test_llama_cpp_tool_loop.py tests/test_safetensors_tool_loop.py

