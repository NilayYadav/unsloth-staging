name: "staging-6846 ubuntu-latest"
on:
  push:
    branches: ["pr-6846-xplat-ci"]
    paths:
      - 'studio/frontend/src/app/routes/__root.tsx'
      - 'studio/frontend/src/components/app-sidebar.tsx'
      - 'studio/frontend/src/components/command-palette.tsx'
      - 'studio/frontend/src/components/ui/animated-theme-toggler.tsx'
      - 'studio/frontend/src/config/env.ts'
      - 'studio/frontend/src/features/settings/stores/settings-dialog-store.ts'
      - 'studio/frontend/src/i18n/locales/en.ts'
      - 'studio/frontend/src/lib/focus.ts'
      - 'studio/frontend/src/lib/navigation-nonce.ts'
      - 'studio/frontend/src/stores/command-palette.ts'
      - '.github/workflows/staging-6846-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
